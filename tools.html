<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
        href="data:image/x-icon;base64,AAABAAEAEBAQAAEABAAoAQAAFgAAACgAAAAQAAAAIAAAAAEABAAAAAAAgAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAASYfrAABZ/wD39/cAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACIAAAIgAAAAADMzMAAAAAADMzMzAAAAAAMzMzMAAAAAAzMzMwAAAAADMzMzAAAAAAEyIjEAAAAAAwMjAwAAAAADMzMzAAAAAAAzMzAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAD//wAA//8AAOAPAADwHwAA4A8AAIADAADABwAA4A8AAOAPAADgDwAA4A8AAOAPAADwHwAA+D8AAP//AAD//wAA"
        rel="icon" type="image/x-icon">
    <title>工具箱</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6;
            color: #333;
            background: #fafafa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            padding: 2.5rem 1rem;
            text-align: center;
        }
        header h1 { font-size: 2rem; font-weight: 300; letter-spacing: 2px; }
        header p  { opacity: 0.9; margin-top: 0.4rem; font-size: 0.95rem; }

        main {
            max-width: 720px;
            width: 100%;
            margin: 2rem auto 0;
            padding: 0 1.5rem 3rem;
            flex: 1;
        }

        /* ── 卡片 ── */
        .tool-card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,.06);
            overflow: hidden;
            margin-bottom: 1.5rem;
        }

        /* ── Tab 栏 ── */
        .tab-bar {
            display: flex;
            border-bottom: 1px solid #eee;
        }
        .tab-btn {
            flex: 1;
            padding: 0.85rem 1rem;
            background: none;
            border: none;
            border-radius: 0;
            font-size: 0.95rem;
            font-weight: 500;
            color: #888;
            cursor: pointer;
            transition: color 0.15s, background 0.15s;
            position: relative;
        }
        .tab-btn:hover { color: #555; background: #fafafa; }
        .tab-btn.active { color: #667eea; }
        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0; right: 0;
            height: 2px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        /* ── Tab 内容 ── */
        .tab-panel { display: none; padding: 1.75rem; }
        .tab-panel.active { display: block; }

        .desc {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: #555;
            margin-bottom: 0.4rem;
        }

        textarea {
            width: 100%;
            min-height: 140px;
            padding: 0.75rem 0.9rem;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
            font-size: 0.875rem;
            line-height: 1.5;
            resize: vertical;
            transition: border-color 0.15s;
        }
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,.15);
        }
        textarea[readonly] { background: #f8f9fb; color: #333; }

        .field { margin-bottom: 1rem; }
        .field:last-child { margin-bottom: 0; }

        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1rem;
            font-size: 0.85rem;
            color: #555;
        }
        .options label.option {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            margin: 0;
            font-weight: 400;
            cursor: pointer;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin-bottom: 1rem;
        }

        button {
            padding: 0.5rem 1.1rem;
            border: none;
            border-radius: 8px;
            font-size: 0.875rem;
            cursor: pointer;
            transition: opacity 0.15s, transform 0.1s;
        }
        button:active { transform: scale(0.98); }
        .btn-primary  { background: linear-gradient(135deg,#667eea 0%,#764ba2 100%); color:#fff; }
        .btn-secondary { background: #f0f0f0; color: #444; }
        .btn-primary:hover, .btn-secondary:hover { opacity: 0.9; }

        .status { min-height: 1.25rem; font-size: 0.8rem; margin-top: 0.5rem; }
        .status.error { color: #c0392b; }
        .status.ok    { color: #27ae60; }

        footer {
            text-align: center;
            padding: 2rem 1rem;
            color: #bbb;
            font-size: 0.85rem;
            margin-top: auto;
        }
    </style>
</head>

<body>
    <header>
        <h1>工具箱</h1>
        <p>轻量在线小工具</p>
    </header>

    <main>
        <div class="tool-card">
            <!-- Tab 栏 -->
            <div class="tab-bar">
                <button class="tab-btn active" data-tab="decode">Base64 解码</button>
                <button class="tab-btn"        data-tab="encode">Base64 编码</button>
            </div>

            <!-- 解码面板 -->
            <div class="tab-panel active" id="panel-decode">
                <p class="desc">支持标准 Base64 与 URL-safe Base64（<code>-</code> / <code>_</code>），输出 UTF-8 文本。</p>

                <div class="options">
                    <label class="option">
                        <input type="checkbox" id="url-safe" checked>
                        自动处理 URL-safe Base64
                    </label>
                    <label class="option">
                        <input type="checkbox" id="strip-whitespace" checked>
                        忽略空白字符
                    </label>
                </div>

                <div class="field">
                    <label for="b64-input">输入（Base64）</label>
                    <textarea id="b64-input" placeholder="粘贴 Base64 字符串…"></textarea>
                </div>

                <div class="actions">
                    <button type="button" class="btn-primary"   id="decode-btn">解码</button>
                    <button type="button" class="btn-secondary" id="dec-clear-btn">清空</button>
                    <button type="button" class="btn-secondary" id="dec-copy-btn">复制结果</button>
                </div>

                <div class="field">
                    <label for="b64-output">输出（文本）</label>
                    <textarea id="b64-output" readonly placeholder="解码结果将显示在这里…"></textarea>
                </div>

                <div class="status" id="dec-status" aria-live="polite"></div>
            </div>

            <!-- 编码面板 -->
            <div class="tab-panel" id="panel-encode">
                <p class="desc">将文本编码为 Base64，可选输出 URL-safe 格式（<code>+</code> → <code>-</code>，<code>/</code> → <code>_</code>）。</p>

                <div class="options">
                    <label class="option">
                        <input type="checkbox" id="enc-url-safe" checked>
                        输出 URL-safe Base64
                    </label>
                    <label class="option">
                        <input type="checkbox" id="enc-strip-padding">
                        去掉末尾 <code>=</code> 填充
                    </label>
                </div>

                <div class="field">
                    <label for="enc-input">输入（文本）</label>
                    <textarea id="enc-input" placeholder="输入要编码的文本…"></textarea>
                </div>

                <div class="actions">
                    <button type="button" class="btn-primary"   id="encode-btn">编码</button>
                    <button type="button" class="btn-secondary" id="enc-clear-btn">清空</button>
                    <button type="button" class="btn-secondary" id="enc-copy-btn">复制结果</button>
                </div>

                <div class="field">
                    <label for="enc-output">输出（Base64）</label>
                    <textarea id="enc-output" readonly placeholder="编码结果将显示在这里…"></textarea>
                </div>

                <div class="status" id="enc-status" aria-live="polite"></div>
            </div>
        </div>
    </main>

    <footer>工具箱</footer>

    <script>
        /* ── Tab 切换 ── */
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
            });
        });

        /* ── 解码 ── */
        const decInput  = document.getElementById('b64-input');
        const decOutput = document.getElementById('b64-output');
        const decStatus = document.getElementById('dec-status');
        const urlSafe   = document.getElementById('url-safe');
        const stripWs   = document.getElementById('strip-whitespace');

        const setDecStatus = (msg, type) => {
            decStatus.textContent = msg;
            decStatus.className = 'status' + (type ? ' ' + type : '');
        };

        const normalizeB64 = (raw) => {
            let s = raw;
            if (stripWs.checked) s = s.replace(/\s+/g, '');
            if (urlSafe.checked) s = s.replace(/-/g, '+').replace(/_/g, '/');
            const pad = s.length % 4 === 0 ? '' : '='.repeat(4 - (s.length % 4));
            return s + pad;
        };

        const b64ToUtf8 = (b64) => {
            const bin = atob(b64);
            const bytes = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            return new TextDecoder('utf-8', { fatal: false }).decode(bytes);
        };

        const decode = () => {
            const raw = decInput.value;
            if (!raw.trim()) { decOutput.value = ''; setDecStatus(''); return; }
            try {
                const normalized = normalizeB64(raw);
                if (!/^[A-Za-z0-9+/=]+$/.test(normalized)) throw new Error('包含非法 Base64 字符');
                const text = b64ToUtf8(normalized);
                decOutput.value = text;
                setDecStatus('解码成功 · ' + text.length + ' 字符', 'ok');
            } catch (err) {
                decOutput.value = '';
                setDecStatus('解码失败：' + (err.message || '无效的 Base64'), 'error');
            }
        };

        document.getElementById('decode-btn').addEventListener('click', decode);
        document.getElementById('dec-clear-btn').addEventListener('click', () => {
            decInput.value = ''; decOutput.value = ''; setDecStatus(''); decInput.focus();
        });
        document.getElementById('dec-copy-btn').addEventListener('click', async () => {
            if (!decOutput.value) return;
            try { await navigator.clipboard.writeText(decOutput.value); setDecStatus('已复制到剪贴板', 'ok'); }
            catch { setDecStatus('复制失败，请手动选择复制', 'error'); }
        });
        decInput.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') decode(); });

        /* ── 编码 ── */
        const encInput    = document.getElementById('enc-input');
        const encOutput   = document.getElementById('enc-output');
        const encStatus   = document.getElementById('enc-status');
        const encUrlSafe  = document.getElementById('enc-url-safe');
        const encStripPad = document.getElementById('enc-strip-padding');

        const setEncStatus = (msg, type) => {
            encStatus.textContent = msg;
            encStatus.className = 'status' + (type ? ' ' + type : '');
        };

        const utf8ToB64 = (text) => {
            const bytes = new TextEncoder().encode(text);
            let bin = '';
            bytes.forEach(b => bin += String.fromCharCode(b));
            return btoa(bin);
        };

        const encode = () => {
            const raw = encInput.value;
            if (!raw) { encOutput.value = ''; setEncStatus(''); return; }
            try {
                let result = utf8ToB64(raw);
                if (encUrlSafe.checked)  result = result.replace(/\+/g, '-').replace(/\//g, '_');
                if (encStripPad.checked) result = result.replace(/=+$/, '');
                encOutput.value = result;
                setEncStatus('编码成功 · ' + result.length + ' 字符', 'ok');
            } catch (err) {
                encOutput.value = '';
                setEncStatus('编码失败：' + (err.message || '未知错误'), 'error');
            }
        };

        document.getElementById('encode-btn').addEventListener('click', encode);
        document.getElementById('enc-clear-btn').addEventListener('click', () => {
            encInput.value = ''; encOutput.value = ''; setEncStatus(''); encInput.focus();
        });
        document.getElementById('enc-copy-btn').addEventListener('click', async () => {
            if (!encOutput.value) return;
            try { await navigator.clipboard.writeText(encOutput.value); setEncStatus('已复制到剪贴板', 'ok'); }
            catch { setEncStatus('复制失败，请手动选择复制', 'error'); }
        });
        encInput.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') encode(); });
    </script>
</body>

</html>
